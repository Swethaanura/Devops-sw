name: swetha pipeline

on:
  push:
    branches: ["main", "pipeline-branch"]
  pull_request:
    branches: ["main", "pipeline-branch"]
  workflow_dispatch:
    inputs:
      target_instance:
        description: "Which Flask instance to update (app1 or app2)"
        required: true
        default: "app1"
        type: choice
        options:
          - app1
          - app2
      app_version:
        description: "Version string to report from the updated instance"
        required: true
        default: "1.0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r DevOps/requirements.txt

      - name: Run Tests
        run: |
          echo "Running tests..."
          python -m pytest || true

  docker:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      target_instance: ${{ steps.vars.outputs.target_instance }}
      app_version: ${{ steps.vars.outputs.app_version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set deployment variables
        id: vars
        run: |
          echo "image_tag=run-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "target_instance=${{ github.event.inputs.target_instance || 'app1' }}" >> "$GITHUB_OUTPUT"
          echo "app_version=${{ github.event.inputs.app_version || '1.0' }}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/swetha-app:${{ steps.vars.outputs.image_tag }} ./DevOps
          docker push ${{ secrets.DOCKER_USERNAME }}/swetha-app:${{ steps.vars.outputs.image_tag }}

  deploy:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "DevOps/docker-compose.yml"
          target: "/home/${{ secrets.VM_USER }}/app"
          strip_components: 1

      - name: Update target instance tag and redeploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: IMAGE_TAG,TARGET_INSTANCE,APP_VERSION
          script: |
            cd ~/app
            touch .env
            if [ "$TARGET_INSTANCE" = "app1" ]; then
              VAR_TAG=APP1_IMAGE_TAG
              VAR_VERSION=APP1_VERSION
            else
              VAR_TAG=APP2_IMAGE_TAG
              VAR_VERSION=APP2_VERSION
            fi
            grep -v "^${VAR_TAG}=" .env > .env.tmp || true
            mv .env.tmp .env
            grep -v "^${VAR_VERSION}=" .env > .env.tmp || true
            mv .env.tmp .env
            echo "${VAR_TAG}=${IMAGE_TAG}" >> .env
            echo "${VAR_VERSION}=${APP_VERSION}" >> .env
            docker compose pull
            docker compose up -d
        env:
          IMAGE_TAG: ${{ needs.docker.outputs.image_tag }}
          TARGET_INSTANCE: ${{ needs.docker.outputs.target_instance }}
          APP_VERSION: ${{ needs.docker.outputs.app_version }}