name: swetha pipeline

on:
  push:
    branches: [ "main", "pipeline-branch" ]
  pull_request:
    branches: [ "main", "pipeline-branch" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r DevOps/requirements.txt

      - name: Run Tests
        run: |
          echo "Running tests..."
          python -m pytest || true

  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/swetha-app:latest ./DevOps
          docker push ${{ secrets.DOCKER_USERNAME }}/swetha-app:latest

  deploy:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: SSH into VM and Deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            docker compose pull
            docker compose up -d