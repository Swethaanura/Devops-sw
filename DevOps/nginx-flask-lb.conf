# Nginx reverse proxy + load balancer for the two Flask app instances.
# Deploy this file to /etc/nginx/sites-available/ on the VM (or merge its
# contents into your existing site config), then symlink it into
# sites-enabled, test, and reload:
#
#   sudo cp nginx-flask-lb.conf /etc/nginx/sites-available/flask-app
#   sudo ln -sf /etc/nginx/sites-available/flask-app /etc/nginx/sites-enabled/flask-app
#   sudo nginx -t
#   sudo systemctl reload nginx

upstream flask_backend {
    server 127.0.0.1:8001;
    server 127.0.0.1:8002;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://flask_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}